  <!-- Vertical Micro Trace -->
  <path d="M21 21 V45" stroke="url(#circuitGrad)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="21" cy="46" r="2" fill="#38BDF8" />

  <!-- Diagonal connection -->
  <path d="M21 27 L15 33" stroke="url(#circuitGrad)" stroke-width="1.5" stroke-linecap="round" />
